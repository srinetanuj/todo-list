<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List App</title>

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- Google Font - Lato -->
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Main Container -->
    <div class="container py-5">
      <!-- Header -->
      <header class="mb-5">
        <div class="d-flex justify-content-between align-items-center">
          <h1 class="h2 mb-0">My Todos</h1>
          <button
            class="btn btn-primary rounded-circle shadow-sm"
            style="width: 48px; height: 48px"
            data-bs-toggle="modal"
            data-bs-target="#todoModal"
          >
            <i class="fas fa-plus"></i>
          </button>
        </div>
      </header>

      <!-- Todo Container -->
      <div id="todoContainer" class="row g-4"></div>
    </div>

    <!-- Empty State Template -->
    <div id="emptyTemplate" class="d-none">
      <div class="col-12 empty-state">
        <h4 class="mb-0">No todos...</h4>
      </div>
    </div>

    <!-- Todo Card Template -->
    <div id="todoTemplate" class="d-none">
      <div class="col-12 col-md-6 col-lg-4">
        <div class="todo-card">
          <div class="d-flex justify-content-between align-items-start">
            <div class="flex-grow-1">
              <div class="d-flex align-items-center mb-2">
                <i class="fas fa-check-circle done-icon me-2 d-none"></i>
                <h5 class="mb-0 todo-title"></h5>
              </div>
              <p class="text-muted mb-0 todo-desc"></p>
            </div>
            <div class="dropdown ms-3">
              <button class="menu-btn" data-bs-toggle="dropdown">
                <i class="fas fa-ellipsis-h"></i>
              </button>
              <ul class="dropdown-menu dropdown-menu-end shadow">
                <li class="mark-done-item">
                  <a class="dropdown-item mark-done-btn">
                    <i class="fas fa-check me-2"></i>Mark as done
                  </a>
                </li>
                <li>
                  <a class="dropdown-item delete-btn">
                    <i class="fas fa-trash me-2"></i>Delete
                  </a>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Add Todo Modal -->
    <div class="modal fade" id="todoModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
          <div class="modal-header border-0 pb-0">
            <h5 class="modal-title fw-bold">Add New Todo</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body pt-3">
            <div class="mb-3">
              <label for="todoTitle" class="form-label fw-semibold"
                >Title *</label
              >
              <input
                type="text"
                class="form-control form-control-lg"
                id="todoTitle"
                required
              />
            </div>
            <div class="mb-3">
              <label for="todoDescription" class="form-label fw-semibold"
                >Description *</label
              >
              <textarea
                class="form-control"
                id="todoDescription"
                rows="3"
                required
              ></textarea>
            </div>
          </div>
          <div class="modal-footer border-0 pt-0">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">
              Cancel
            </button>
            <button type="button" class="btn btn-primary px-4" id="saveTodo">
              Save
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script src="index.js"></script>
  </body>
</html>
